<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coworking Space Dashboard</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --panel-alt: #f8fafc;
      --border: #dfe7f3;
      --text: #14213d;
      --muted: #53657d;
      --primary: #1f6feb;
      --primary-soft: rgba(31, 111, 235, 0.12);
      --success: #12805c;
      --warning: #d97706;
      --danger: #b42318;
      --shadow: 0 14px 32px rgba(20, 33, 61, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
    }
    .page { max-width: 1280px; margin: 32px auto; padding: 0 20px 40px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 24px; flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: clamp(28px, 3vw, 42px); }
    .status-pill { display: inline-flex; align-items: center; gap: 8px; background: white; border: 1px solid var(--border); border-radius: 999px; padding: 8px 12px; box-shadow: var(--shadow); color: var(--text); }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); display: inline-block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 20px 0 28px; }
    .card, .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
    .card { padding: 20px; }
    .small-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-bottom: 10px; }
    .metric { font-size: clamp(24px, 2vw, 34px); margin: 0; font-weight: 800; line-height: 1.1; }
    .submetric { margin-top: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
    .content-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-top: 12px; }
    .panel-header { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); background: var(--panel-alt); }
    .panel-header h2 { margin: 0; font-size: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { background: #f9fbff; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 800; }
    tbody tr:hover { background: #f7faff; }
    .status-text { font-size: 12px; font-weight: 700; padding: 6px 8px; border-radius: 999px; display: inline-block; }
    .status-good { background: rgba(18, 128, 92, 0.12); color: var(--success); }
    .status-warn { background: rgba(217, 119, 6, 0.12); color: var(--warning); }
    .status-bad { background: rgba(180, 35, 24, 0.12); color: var(--danger); }
    .scenario-body { padding: 18px 20px 20px; }
    .scenario-row { display: grid; grid-template-columns: 1.2fr 90px 120px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .scenario-row:last-child { border-bottom: none; }
    label { font-weight: 700; color: var(--muted); font-size: 13px; }
    input[type="number"] { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 15px; background: #fff; color: var(--text); }
    .delta-box { margin-top: 18px; background: var(--primary-soft); border: 1px solid rgba(31, 111, 235, 0.16); border-radius: 14px; padding: 16px; }
    .delta-box h3 { margin: 0 0 8px; font-size: 16px; }
    .delta-value { font-size: clamp(26px, 3vw, 38px); font-weight: 800; margin: 0; line-height: 1.15; }
    .muted { color: var(--muted); }
    @media (max-width: 900px) { .content-grid { grid-template-columns: 1fr; } .scenario-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>Coworking Space Dashboard</h1>
      <div class="status-pill"><span class="dot"></span> <span id="sync-status">Syncing live sheet</span></div>
    </div>

    <div class="grid" id="summary-cards"></div>

    <div class="content-grid">
      <div class="panel">
        <div class="panel-header">
          <h2>Category summary</h2>
        </div>
        <table>
          <thead>
            <tr>
              <th>Category</th>
              <th>Units</th>
              <th>Occupied</th>
              <th>Vacant</th>
              <th>Vacancy rate</th>
              <th>Monthly revenue</th>
            </tr>
          </thead>
          <tbody id="category-table"></tbody>
        </table>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>Scenario modeling</h2>
        </div>
        <div class="scenario-body">
          <div id="scenario-controls"></div>
          <div class="delta-box">
            <h3>Projected monthly income</h3>
            <p class="delta-value" id="scenario-total">$0</p>
            <div class="muted" id="scenario-delta">Change from current: $0</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1COBQ-4rNLnpW3j8tuJ86SwMGfA6IVrAfe6fU8xp9AYM';
    const SHEET_RANGE = 'Testing!A1:E95';
    const CATEGORY_KEYS = [
      'individual', 'nonprofit', 'for profit', 'for-profit', 'hot desk',
      'dedicated desk', 'small suite', 'medium suite', 'large suite'
    ];

    const summaryCards = document.getElementById('summary-cards');
    const tableBody = document.getElementById('category-table');
    const scenarioControls = document.getElementById('scenario-controls');
    const scenarioTotal = document.getElementById('scenario-total');
    const scenarioDelta = document.getElementById('scenario-delta');
    const syncStatus = document.getElementById('sync-status');

    const state = { rows: [], categories: [], scenario: {} };

    function formatCurrency(value) {
      const amount = Number(value) || 0;
      return '$' + amount.toLocaleString(undefined, { maximumFractionDigits: 0 });
    }

    function normalizeString(value) {
      if (value == null) return '';
      return String(value).trim();
    }

    function toNumber(value) {
      if (value == null || value === '') return 0;
      const n = Number(String(value).replace(/[$,%\s]/g, ''));
      return Number.isFinite(n) ? n : 0;
    }

    function getCellValue(row, keys) {
      for (const key of keys) {
        const value = row[key];
        if (value !== undefined && value !== null && String(value).trim() !== '') {
          return value;
        }
      }
      return '';
    }

    function parseGoogleSheet(rawText) {
      const match = rawText.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/);
      if (!match) return [];
      const payload = JSON.parse(match[1]);
      const cols = payload?.table?.cols || [];
      const rows = payload?.table?.rows || [];

      return rows.map((row) => {
        const obj = {};
        cols.forEach((col, idx) => {
          const cell = (row.c && row.c[idx]) ? row.c[idx] : null;
          const label = normalizeString(col.label || col.id || `col${idx}`);
          obj[label] = (cell && cell.v !== undefined) ? cell.v : '';
          if (cell && cell.f) obj[`${label}Formatted`] = cell.f;
        });
        return obj;
      });
    }

    function inferCategoryName(row) {
      const raw = normalizeString(
        getCellValue(row, ['Category', 'Type', 'Member Type', 'Tenant Type', 'Lease Type', 'Unit Type', 'Product', 'Name'])
      ).toLowerCase();

      if (!raw) {
        const text = normalizeString(Object.values(row).join(' ')).toLowerCase();
        for (const key of CATEGORY_KEYS) {
          if (text.includes(key)) return key;
        }
        return 'unknown';
      }

      for (const key of CATEGORY_KEYS) {
        if (raw.includes(key)) return key;
      }
      return raw;
    }

    function inferStatus(row) {
      const status = normalizeString(
        getCellValue(row, ['Status', 'Occupancy', 'Lease Status', 'Occupied', 'Vacant', 'Tenant'])
      ).toLowerCase();

      if (status.includes('vacant')) return 'vacant';
      if (status.includes('occupied') || status.includes('leased') || status.includes('tenant')) return 'occupied';

      const tenant = normalizeString(getCellValue(row, ['Tenant', 'Member', 'Name', 'Leaseholder', 'Occupant']));
      const tenantLower = tenant.toLowerCase();
      if (!tenant || tenantLower === 'vacant' || tenantLower === 'none') return 'vacant';
      return 'occupied';
    }

    function inferRate(row) {
      const raw = getCellValue(row, ['Actual Rate', 'Target Rate', 'Rate', 'Monthly Rate', 'Annual Rate', 'Price', 'Monthly Rent', 'Annual Rent']);
      if (raw === '') return 0;
      return toNumber(raw);
    }

    function inferUnits(row) {
      const raw = getCellValue(row, ['Units', 'Unit Count', 'Count', 'Quantity', 'Qty']);
      if (raw !== '') return Math.max(1, Number(raw) || 1);
      return 1;
    }

    function canonicalizeCategory(value) {
      const v = normalizeString(value).toLowerCase();
      if (v.includes('individual')) return 'Individual';
      if (v.includes('nonprofit') || v.includes('non-profit')) return 'Nonprofit';
      if (v.includes('for-profit') || v.includes('for profit')) return 'For Profit';
      if (v.includes('hot desk')) return 'Hot Desk';
      if (v.includes('dedicated desk')) return 'Dedicated Desk';
      if (v.includes('small suite')) return 'Small Suite';
      if (v.includes('medium suite')) return 'Medium Suite';
      if (v.includes('large suite')) return 'Large Suite';
      return value || 'Unknown';
    }

    function buildCategorySummaries(rawRows) {
      const map = new Map();

      rawRows.forEach((row) => {
        const category = canonicalizeCategory(inferCategoryName(row));
        const status = inferStatus(row);
        const rate = inferRate(row);
        const units = inferUnits(row);

        if (!map.has(category)) {
          map.set(category, {
            name: category,
            totalUnits: 0,
            occupiedUnits: 0,
            vacantUnits: 0,
            revenue: 0,
            rateTotal: 0,
            count: 0
          });
        }

        const entry = map.get(category);
        entry.totalUnits += units;
        entry.count += 1;

        if (status === 'occupied') {
          entry.occupiedUnits += units;
          entry.revenue += rate * units;
          entry.rateTotal += rate * units;
        } else {
          entry.vacantUnits += units;
        }
      });

      return Array.from(map.values()).map((entry) => {
        const avgRate = entry.occupiedUnits > 0 ? entry.rateTotal / entry.occupiedUnits : 0;
        const vacancyRate = entry.totalUnits > 0 ? (entry.vacantUnits / entry.totalUnits) * 100 : 0;
        return {
          ...entry,
          avgRate,
          vacancyRate,
          occupancyRate: entry.totalUnits > 0 ? (entry.occupiedUnits / entry.totalUnits) * 100 : 0
        };
      }).sort((a, b) => b.revenue - a.revenue);
    }

    function renderSummaryCards(categories) {
      const totalMonthly = categories.reduce((sum, item) => sum + item.revenue, 0);
      const totalUnits = categories.reduce((sum, item) => sum + item.totalUnits, 0);
      const totalOccupied = categories.reduce((sum, item) => sum + item.occupiedUnits, 0);
      const overallVacancy = totalUnits > 0 ? ((totalUnits - totalOccupied) / totalUnits) * 100 : 0;

      const cards = [
        { label: 'Total monthly revenue', value: formatCurrency(totalMonthly), sub: 'Across all categories' },
        { label: 'Occupied units', value: totalOccupied.toLocaleString(), sub: `${totalUnits.toLocaleString()} total units` },
        { label: 'Vacancy rate', value: `${overallVacancy.toFixed(1)}%`, sub: 'Overall vacancy' },
        { label: 'Top revenue category', value: categories[0]?.name || 'N/A', sub: formatCurrency(categories[0]?.revenue || 0) }
      ];

      summaryCards.innerHTML = cards.map((card) => `
        <div class="card">
          <div class="small-label">${card.label}</div>
          <p class="metric">${card.value}</p>
          <div class="submetric">${card.sub}</div>
        </div>
      `).join('');
    }

    function getVacancyStatus(rate) {
      if (rate >= 25) return 'status-bad';
      if (rate >= 10) return 'status-warn';
      return 'status-good';
    }

    function renderCategoryTable(categories) {
      tableBody.innerHTML = categories.map((category) => {
        const statusClass = getVacancyStatus(category.vacancyRate);
        return `
          <tr>
            <td>${category.name}</td>
            <td>${category.totalUnits}</td>
            <td>${category.occupiedUnits}</td>
            <td>${category.vacantUnits}</td>
            <td><span class="status-text ${statusClass}">${category.vacancyRate.toFixed(1)}%</span></td>
            <td>${formatCurrency(category.revenue)}</td>
          </tr>
        `;
      }).join('');
    }

    function calculateScenarioValue(category, fillMore, priceChange) {
      const occupied = Math.max(0, category.occupiedUnits + Math.max(0, fillMore));
      const unitRate = Math.max(0, category.avgRate + priceChange);
      return occupied * unitRate;
    }

    function renderScenarioControls(categories) {
      state.scenario = {};
      categories.forEach((category) => {
        state.scenario[category.name] = { fill: 0, price: 0 };
      });

      scenarioControls.innerHTML = categories.map((category) => `
        <div class="scenario-row">
          <label>${category.name}</label>
          <input data-name="${category.name}" data-kind="fill" type="number" value="0" min="0" step="1" aria-label="Fill more ${category.name}" />
          <input data-name="${category.name}" data-kind="price" type="number" value="0" min="-10000" step="10" aria-label="Price change for ${category.name}" />
        </div>
      `).join('');

      scenarioControls.querySelectorAll('input').forEach((input) => {
        input.addEventListener('input', () => {
          const { name, kind } = input.dataset;
          const value = Number(input.value) || 0;
          state.scenario[name][kind === 'fill' ? 'fill' : 'price'] = value;
          updateScenarioTotals();
        });
      });

      updateScenarioTotals();
    }

    function updateScenarioTotals() {
      const categories = state.categories;
      if (!categories || !categories.length) return;

      const currentTotal = categories.reduce((sum, item) => sum + item.revenue, 0);
      let projected = 0;

      categories.forEach((category) => {
        const { fill, price } = state.scenario[category.name] || { fill: 0, price: 0 };
        projected += calculateScenarioValue(category, fill, price);
      });

      const delta = projected - currentTotal;
      scenarioTotal.textContent = formatCurrency(projected);
      const sign = delta >= 0 ? '+' : '-';
      scenarioDelta.textContent = `Change from current: ${sign}${formatCurrency(Math.abs(delta))}`;
    }

    async function loadData() {
      syncStatus.textContent = 'Loading sheet data...';
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;&range=${encodeURIComponent(SHEET_RANGE)}`;
        const response = await fetch(url, { cache: 'no-store' });
        const rawText = await response.text();
        const rows = parseGoogleSheet(rawText);

        if (!rows.length) {
          throw new Error('No rows returned from sheet.');
        }

        state.rows = rows;
        state.categories = buildCategorySummaries(rows);
        renderSummaryCards(state.categories);
        renderCategoryTable(state.categories);
        renderScenarioControls(state.categories);
        syncStatus.textContent = 'Live Google Sheet connected';
      } catch (error) {
        console.error(error);
        syncStatus.textContent = 'Using local fallback data';

        const fallback = [
          { Category: 'Individual', Tenant: 'Member A', Actual Rate: 200, Occupancy: 'Occupied' },
          { Category: 'Nonprofit', Tenant: 'Member B', Actual Rate: 450, Occupancy: 'Occupied' },
          { Category: 'For Profit', Tenant: 'Member C', Actual Rate: 700, Occupancy: 'Occupied' },
          { Category: 'Hot Desk', Tenant: 'Hot Desk A', Actual Rate: 100, Occupancy: 'Occupied' },
          { Category: 'Dedicated Desk', Tenant: 'Vacant', Actual Rate: 350, Occupancy: 'Vacant' },
          { Category: 'Small Suite', Tenant: 'Vacant', Actual Rate: 1000, Occupancy: 'Vacant' },
          { Category: 'Medium Suite', Tenant: 'Vacant', Actual Rate: 1500, Occupancy: 'Vacant' },
          { Category: 'Large Suite', Tenant: 'Vacant', Actual Rate: 5000, Occupancy: 'Vacant' }
        ];

        state.categories = buildCategorySummaries(fallback);
        renderSummaryCards(state.categories);
        renderCategoryTable(state.categories);
        renderScenarioControls(state.categories);
      }
    }

    loadData();
  </script>
</body>
</html>
